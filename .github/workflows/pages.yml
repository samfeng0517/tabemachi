name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  # Main pushes stay in one queue so two deploys cannot overlap. Pull
  # requests use their own group and do not block a production deploy.
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - name: Validate data
        run: node scripts/validate.mjs data/restaurants.json
      - name: Run tests
        run: npm test

  # Upload and deploy must be separate jobs. deploy-pages lists artifacts by
  # name as soon as it starts, and the Actions API can briefly return zero
  # matches for an artifact that was finalized in the same job a fraction of
  # a second earlier (actions/deploy-pages#451). A job boundary lets the
  # artifact become visible before the lookup. Re-running a combined job
  # also uploads a second github-pages artifact and then fails on the
  # duplicate name.
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Explicit allow-list: only these paths are ever published. Anything
      # else in the repo (including other files under data/) stays private.
      - name: Stage site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -R assets images _site/
          cp data/restaurants.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # A pull request still validates and uploads an artifact, but must not
    # replace the live site. Main pushes and manual runs deploy as before.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
